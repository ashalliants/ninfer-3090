  <text x="32.0" y="72.0" class="t2" font-size="13.5" font-weight="400" text-anchor="start">ashalliants/ninfer-3090 against llama.cpp 36d818e16 (ggml-org Q4_K_M with its MTP and DFlash Q8_0 sidecars), both</text>
  <text x="32.0" y="91.0" class="t2" font-size="13.5" font-weight="400" text-anchor="start">on this card, same prompts, greedy, 300 output tokens, warm. Lapilli does not run this model.</text>
