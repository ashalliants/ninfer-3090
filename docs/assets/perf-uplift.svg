<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img"
     aria-label="Qwen3.8-27B on one RTX 3090, v0.15.1 against the current master: reading a 16K, 32K and 64K prompt is 6%, 12% and 19% faster; an agent turn that writes back a file decodes 87% and 59% faster">
  <title>NInfer-3090 speed-up since v0.15.1, Qwen3.8-27B on one RTX 3090</title>
  <style>
    .nb-surface  { fill: #fcfcfb; }
    .nb-border   { stroke: rgba(11,11,11,0.10); }
    .nb-primary  { fill: #0b0b0b; }
    .nb-secondary{ fill: #52514e; }
    .nb-muted    { fill: #898781; }
    .nb-hair     { stroke: #e1e0d9; }
    .nb-baseline { stroke: #c3c2b7; }
    .nb-old      { fill: #c3c2b7; }
    .nb-s1       { fill: #2a78d6; }
    .nb-pill     { fill: #e3f0fd; }
    .nb-pilltext { fill: #0b4a99; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .nb-surface  { fill: #1a1a19; }
      .nb-border   { stroke: rgba(255,255,255,0.10); }
      .nb-primary  { fill: #ffffff; }
      .nb-secondary{ fill: #c3c2b7; }
      .nb-muted    { fill: #898781; }
      .nb-hair     { stroke: #2c2c2a; }
      .nb-baseline { stroke: #383835; }
      .nb-old      { fill: #4a4a46; }
      .nb-s1       { fill: #3987e5; }
      .nb-pill     { fill: #14304f; }
      .nb-pilltext { fill: #a9cdf5; }
    }
  </style>

  <rect x="1" y="1" width="958" height="328" rx="16" class="nb-surface nb-border" stroke-width="1"/>

  <!-- legend -->
  <rect x="36" y="20" width="14" height="14" rx="3" class="nb-old"/>
  <text x="56" y="31" font-size="13" font-weight="600" class="nb-primary">v0.15.1</text>
  <rect x="136" y="20" width="14" height="14" rx="3" class="nb-s1"/>
  <text x="156" y="31" font-size="13" font-weight="600" class="nb-primary">This release</text>

  <text x="36" y="50" font-size="12" class="nb-muted">Qwen3.8-27B, one RTX 3090, launcher settings (DFlash2, cuBLAS prefill, rk4v4 KV) &#183; same card, same session, interleaved runs &#183; 2026-10-13</text>

  <line x1="36" y1="64" x2="924" y2="64" class="nb-hair" stroke-width="1"/>

  <!-- Panel 1: reading a long prompt -->
  <g>
    <text x="36" y="96" font-size="15" font-weight="600" class="nb-primary">Reading a long prompt (prefill)</text>
    <text x="36" y="113" font-size="11" class="nb-muted">tok/s, higher is better</text>
    <line x1="110" y1="124" x2="110" y2="246" class="nb-baseline" stroke-width="1"/>

    <text x="100" y="152" font-size="12" text-anchor="end" class="nb-secondary">16K prompt</text>
    <rect x="110" y="128" width="179" height="14" rx="3" class="nb-old"/>
    <text x="297" y="139" font-size="11" class="nb-muted">2,651</text>
    <rect x="110" y="146" width="190" height="14" rx="3" class="nb-s1"/>
    <text x="308" y="157" font-size="12" font-weight="600" class="nb-secondary">2,815</text>
    <rect x="368" y="141" width="48" height="20" rx="10" class="nb-pill"/>
    <text x="392" y="155" font-size="12" font-weight="700" text-anchor="middle" class="nb-pilltext">+6%</text>

    <text x="100" y="192" font-size="12" text-anchor="end" class="nb-secondary">32K prompt</text>
    <rect x="110" y="168" width="155" height="14" rx="3" class="nb-old"/>
    <text x="273" y="179" font-size="11" class="nb-muted">2,290</text>
    <rect x="110" y="186" width="173" height="14" rx="3" class="nb-s1"/>
    <text x="291" y="197" font-size="12" font-weight="600" class="nb-secondary">2,557</text>
    <rect x="368" y="181" width="48" height="20" rx="10" class="nb-pill"/>
    <text x="392" y="195" font-size="12" font-weight="700" text-anchor="middle" class="nb-pilltext">+12%</text>

    <text x="100" y="232" font-size="12" text-anchor="end" class="nb-secondary">64K prompt</text>
    <rect x="110" y="208" width="123" height="14" rx="3" class="nb-old"/>
    <text x="241" y="219" font-size="11" class="nb-muted">1,823</text>
    <rect x="110" y="226" width="147" height="14" rx="3" class="nb-s1"/>
    <text x="265" y="237" font-size="12" font-weight="600" class="nb-secondary">2,172</text>
    <rect x="368" y="221" width="48" height="20" rx="10" class="nb-pill"/>
    <text x="392" y="235" font-size="12" font-weight="700" text-anchor="middle" class="nb-pilltext">+19%</text>
  </g>

  <!-- Panel 2: copying what the conversation already contains -->
  <g>
    <text x="500" y="96" font-size="15" font-weight="600" class="nb-primary">Agent turns that write a file back (decode)</text>
    <text x="500" y="113" font-size="11" class="nb-muted">tok/s on text copied from the prompt, one lane, higher is better</text>
    <line x1="574" y1="124" x2="574" y2="206" class="nb-baseline" stroke-width="1"/>

    <text x="564" y="152" font-size="12" text-anchor="end" class="nb-secondary">2K context</text>
    <rect x="574" y="128" width="102" height="14" rx="3" class="nb-old"/>
    <text x="684" y="139" font-size="11" class="nb-muted">243</text>
    <rect x="574" y="146" width="190" height="14" rx="3" class="nb-s1"/>
    <text x="772" y="157" font-size="12" font-weight="600" class="nb-secondary">454</text>
    <rect x="860" y="141" width="56" height="20" rx="10" class="nb-pill"/>
    <text x="888" y="155" font-size="12" font-weight="700" text-anchor="middle" class="nb-pilltext">+87%</text>

    <text x="564" y="192" font-size="12" text-anchor="end" class="nb-secondary">32K context</text>
    <rect x="574" y="168" width="106" height="14" rx="3" class="nb-old"/>
    <text x="688" y="179" font-size="11" class="nb-muted">254</text>
    <rect x="574" y="186" width="169" height="14" rx="3" class="nb-s1"/>
    <text x="751" y="197" font-size="12" font-weight="600" class="nb-secondary">403</text>
    <rect x="860" y="181" width="56" height="20" rx="10" class="nb-pill"/>
    <text x="888" y="195" font-size="12" font-weight="700" text-anchor="middle" class="nb-pilltext">+59%</text>

    <text x="500" y="232" font-size="11" class="nb-muted">Text that is not a copy decodes at the same speed as before.</text>
  </g>

  <!-- footer -->
  <text x="36" y="290" font-size="11" class="nb-muted">ninfer_bench, interleaved ABBA, two runs per cell. Decode is the best case, 128 tokens that are a copy of the prompt; whole agent sessions gain less (see below).</text>
  <text x="36" y="308" font-size="11" class="nb-muted">Prompts of 4K and below read 1-2% faster. Absolute figures move between sessions, so compare the pairs. Details: docs/performance/qwen3.8-27b.md</text>
</svg>
